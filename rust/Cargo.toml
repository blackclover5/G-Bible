[package]
name = "gbible-rust-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native performance core for G-Bible"

[lib]
name = "_gbible_rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
unicode-normalization = "0.1"
unicode-general-category = "1.0"
