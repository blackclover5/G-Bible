name: checks

# The self-test is the gate.  It runs against a real library, because most
# of what it checks -- the grounding, the guides, the retrieval, the
# citations, the exports -- cannot be exercised against an empty one.  The
# seed tool installs one module of every kind for exactly that reason.

on:
  push:
  pull_request:

jobs:
  secret-and-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Block common secret patterns
        run: |
          if rg -n "(AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]+|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)" \
            --hidden --glob '!**/.git/**' --glob '!**/data/**' --glob '!gbible/store/**' .; then
            echo "Potential secret found in source"
            exit 1
          fi

  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The app runtime needs no packages or build step. Development-only
          # browser test dependencies are installed in their own step below.
          python-version: '3.12'

      - name: Check it compiles and imports
        # Check import and syntax errors before installing runtime/test
        # dependencies, so they are reported directly.
        run: |
          python3 -m compileall -q gbible tools run.py
          python3 -c "import gbible.server.app; print('imports ok')"

      - name: Install test dependencies
        run: python3 -m pip install -r requirements-test.txt

      - name: Run unit tests
        # Fast regression tests for the seams that break quietly:
        # parser -> span table -> render, and database migrations.
        run: python3 -m unittest discover -s gbible/tests -v

      - name: Check database migrations
        run: python3 tools/test_migrations.py

      - name: Install browser test dependencies
        run: python3 -m playwright install --with-deps chromium

      - name: Install a library to test against
        # One module of every kind, so the checks that need material have
        # some.  The seed tool installs fourteen and says so.
        run: python3 tools/seed.py

      - name: Check it against real material
        run: python3 run.py --check

      - name: Check the real browser flow
        run: python3 tools/browser_smoke.py

  rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the native extension
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --interpreter python --out rust/target/wheels
          python -m pip install rust/target/wheels/*.whl
      - name: Check native/Python parity
        run: python tools/test_rust.py
